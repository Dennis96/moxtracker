name: Verifica candidata News
on:
  workflow_dispatch:
  pull_request:
    paths: ['config/news-*.json', 'strumenti/news/**', 'strumenti/build_sito.mjs', 'sito/**', 'prove/news*', '.github/workflows/news-verifica.yml']
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test prove/news.test.js
      - run: npm run sito:build
      - run: node --test prove/news-build.check.mjs
