name: Monitoraggio beta sito

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOX_SITE_URL: https://preview.moxtracker.pages.dev
      MOX_API_URL: https://api.moxtracker.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node strumenti/smoke_beta.mjs
