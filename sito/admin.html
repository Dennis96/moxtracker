  <link rel="icon" href="./assets/mox.ico"><link rel="stylesheet" href="./css/site.css?v=20260823-1">
  <link rel="stylesheet" href="./css/account-support.css?v=20260823-1"><link rel="stylesheet" href="./css/ui-fixes.css">

</head>
<body>
  <a class="skip-link" href="#admin">Vai ai ticket</a>
  <header class="site-header"><nav class="nav" aria-label="Navigazione principale">
    <a class="brand" href="./index.html"><img src="./assets/branding/mox-marchio.webp" alt=""><span>MOX</span></a>
    <div class="nav-links"><a href="./account.html">Account</a><a href="./supporto.html">Supporto</a></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambia tema">☀ / ☾</button>
  </nav></header>
  <main id="admin" class="service-main">
    <section class="service-hero"><span class="eyebrow">Area riservata</span><h1>Ticket MOX</h1><p>Accesso consentito soltanto agli account promossi ad amministratore. Ogni modifica viene registrata.</p></section>
    <p id="admin-message" class="service-message" aria-live="polite">Controllo autorizzazione…</p>
    <section class="service-grid">
      <article class="panel service-card"><h2>Ticket</h2><label class="service-field">Stato<select id="admin-filter"><option value="">Tutti</option><option value="ricevuto">Ricevuto</option><option value="da_verificare">Da verificare</option><option value="pianificato">Pianificato</option><option value="in_lavorazione">In lavorazione</option><option value="risolto">Risolto</option><option value="chiuso">Chiuso</option></select></label><div id="admin-tickets" class="service-list"></div></article>
      <article id="admin-detail" class="panel service-card hidden"><h2 id="admin-title">Dettaglio</h2><div id="admin-messages" class="service-list"></div><form id="admin-form"><label class="service-field">Nuovo stato<select id="admin-status"><option value="ricevuto">Ricevuto</option><option value="da_verificare">Da verificare</option><option value="pianificato">Pianificato</option><option value="in_lavorazione">In lavorazione</option><option value="risolto">Risolto</option><option value="chiuso">Chiuso</option></select></label><label class="service-field">Risposta<textarea id="admin-reply" maxlength="5000"></textarea></label><button class="service-button primary" type="submit">Salva e rispondi</button></form></article>
    </section>
  </main>
