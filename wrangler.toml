# Come Cloudflare deve far girare il server.
#
# `database_id` resta vuoto finche' il database non esiste: si riempie da solo
# con `wrangler d1 create moxtracker`, che stampa la riga da incollare qui.
# Fino ad allora tutto funziona in locale, dove D1 e' un file SQLite sul PC.

name = "moxtracker"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Niente log delle richieste con dati dentro: qui si tiene solo quello che
# serve a capire un guasto.
[observability]
enabled = true

[vars]
# L'Account funziona da tutte e due le origini: SITE_ORIGIN (il sito ufficiale,
# anche base dei link nelle email dei ticket) e PREVIEW_ORIGIN (la preview).
SITE_ORIGIN = "https://moxtracker.app"
PREVIEW_ORIGIN = "https://preview.moxtracker.pages.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAEYng_drA6IkCiE1"
# Il token Resend resta un secret del Worker, mai in questo file o nel sito.
RESEND_FROM = "Mox Support <noreply@moxtracker.app>"
# Ponte temporaneo: i client fino alla 2.9.21 ricevono il manifesto dopo che
# la loro GUI ha iniziato mainloop. La 2.9.22 corregge il difetto nel client.
MOX_RELEASE_RECOVERY_DELAY_MS = "1500"
# Research R3. `RESEARCH_MODE` e' off (niente Research), drain (il rollback:
# niente consensi nuovi ne' upload, revoca e cancellazione aperte) oppure on.
# Si parte da off; il runbook `passaggi/research/RUNBOOK-R3-PRODUZIONE.md` dice
# quando e come passare a on e, se serve, tornare a drain - mai a un Worker
# senza le route Research, una volta distribuita la 2.11.0. Le chiavi HMAC sono
# un secret (`RESEARCH_HMAC_KEYS`), mai qui; la qualification di runtime nasce
# al deploy con `strumenti/research-produzione/qualification.mjs`.
RESEARCH_MODE = "on"
RESEARCH_AMBIENTE = "produzione"
RESEARCH_DEPLOYMENT = "research-produzione-r3"
RESEARCH_MAX_CONTRIBUTIONS_PER_REQUEST = "33"
RESEARCH_MAX_D1_QUERIES_PER_REQUEST = "1000"
# Generata con `qualification.mjs --valida-fino 2026-10-15T00:00:00Z` il
# 15/09/2026. Va rinnovata prima della scadenza: dopo, l'ingresso si chiude da
# solo (consenso nuovo e upload) e revoca e cancellazione restano aperte.
RESEARCH_RUNTIME_QUALIFICATION = '{"versione":1,"id":"q-produzione-2026-09-15","deployment":"research-produzione-r3","max_contributions_per_request":33,"max_d1_queries_per_request":1000,"valida_fino":"2026-10-15T00:00:00Z"}'

# Pulizia giornaliera: allegati dei ticket chiusi dopo 90 giorni, intero
# ticket dopo 365 giorni. La funzione e' idempotente e lavora a lotti.
[triggers]
crons = [ "17 3 * * *" ]

[[ratelimits]]
name = "TICKET_RATE_LIMITER"
namespace_id = "29011"

  [ratelimits.simple]
  limit = 10
  period = 60

# Research, ingresso (consenso nuovo e upload), per origine e per mittente. Un
# client manda al piu' una richiesta ogni 33 contribution in coda, piu' un
# consenso: 30 al minuto coprono lo svuotamento di una coda di ~1.000 partite in
# un colpo solo. Senza questo binding, con RESEARCH_MODE=on, Research non parte.
[[ratelimits]]
name = "RESEARCH_RATE_LIMITER_INGRESSO"
namespace_id = "29021"

  [ratelimits.simple]
  limit = 30
  period = 60

# Research, ciclo di vita (revoca e cancellazione), solo per mittente e su un
# binding separato: chi abusa dell'ingresso non puo' impedire a nessuno di
# ritirare il consenso. Una cancellazione lunga chiede fino a 20 richieste di
# seguito (continuation 202): 60 al minuto non la interrompono mai.
[[ratelimits]]
name = "RESEARCH_RATE_LIMITER_CICLO"
namespace_id = "29022"

  [ratelimits.simple]
  limit = 60
  period = 60

# L'indirizzo definitivo del server. Sta su un sottodominio suo, separato dal
# sito: `moxtracker.app` sara' la pagina che la gente apre, `api.moxtracker.app`
# e' il ricevitore che Mox chiama. Tenerli distinti vuol dire poter rifare il
# sito quando si vuole senza toccare l'indirizzo scritto dentro il programma -
# e quell'indirizzo, una volta distribuito, non si cambia piu'.
[[routes]]
pattern = "api.moxtracker.app"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "moxtracker"
database_id = "85145457-e78e-41bb-b069-41269321db1c"

# Risorse Draft online dedicate, separate dal database delle partite.
[[d1_databases]]
binding = "DRAFT_DB"
database_name = "moxtracker-draft-index"
database_id = "1cbe16b6-b776-4ba7-ba7c-72522535e712"

[[r2_buckets]]
binding = "DRAFT_RAW"
bucket_name = "moxtracker-draft-raw"

[[r2_buckets]]
binding = "TICKET_FILES"
bucket_name = "moxtracker-ticket-files"

# L'installer Windows e' privato nel bucket ma viene servito soltanto dal
# Worker, all'URL HTTPS che compare nel manifesto firmato di Mox.
[[r2_buckets]]
binding = "MOX_RELEASES"
bucket_name = "moxtracker-releases"
