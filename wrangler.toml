# Come Cloudflare deve far girare il server.
#
# `database_id` resta vuoto finche' il database non esiste: si riempie da solo
# con `wrangler d1 create moxtracker`, che stampa la riga da incollare qui.
# Fino ad allora tutto funziona in locale, dove D1 e' un file SQLite sul PC.

name = "moxtracker"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Niente log delle richieste con dati dentro: qui si tiene solo quello che
# serve a capire un guasto.
[observability]
enabled = true

# L'indirizzo definitivo del server. Sta su un sottodominio suo, separato dal
# sito: `moxtracker.app` sara' la pagina che la gente apre, `api.moxtracker.app`
# e' il ricevitore che Mox chiama. Tenerli distinti vuol dire poter rifare il
# sito quando si vuole senza toccare l'indirizzo scritto dentro il programma -
# e quell'indirizzo, una volta distribuito, non si cambia piu'.
[[routes]]
pattern = "api.moxtracker.app"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "moxtracker"
database_id = "85145457-e78e-41bb-b069-41269321db1c"

# Risorse Draft online dedicate, separate dal database delle partite.
[[d1_databases]]
binding = "DRAFT_DB"
database_name = "moxtracker-draft-index"
database_id = "1cbe16b6-b776-4ba7-ba7c-72522535e712"

[[r2_buckets]]
binding = "DRAFT_RAW"
bucket_name = "moxtracker-draft-raw"
