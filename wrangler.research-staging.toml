# SOLO STAGING Research R3 — acceptance G5C-03.
#
# File separato da `wrangler.toml` apposta: in wrangler `routes` e `triggers`
# si ereditano negli ambienti, e un `[env.*]` dentro il file di produzione
# avrebbe ereditato il custom domain `api.moxtracker.app`. Qui non c'e' niente
# da ereditare: nessuna route, nessun cron, nessun binding di produzione,
# soltanto il D1 `moxtracker-research-staging`.
#
#   npx wrangler deploy --config wrangler.research-staging.toml --dry-run
#   npx wrangler deploy --config wrangler.research-staging.toml
#
# I segreti (RESEARCH_HMAC_KEYS, RESEARCH_MISURE_TOKEN) sono dello staging e
# stanno solo su Cloudflare. Produzione: D1 85145457-…, mai qui.

name = "moxtracker-research-staging"
main = "strumenti/research-staging/worker.mjs"
compatibility_date = "2026-08-18"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "moxtracker-research-staging"
database_id = "02829757-def3-4f6e-9593-b985e01f92f6"

[vars]
RESEARCH_AMBIENTE = "staging"
RESEARCH_DEPLOYMENT = "research-staging-g5c03"
RESEARCH_MISURE = "attive"
RESEARCH_ENABLED = "true"
RESEARCH_MAX_CONTRIBUTIONS_PER_REQUEST = "5"
RESEARCH_MAX_D1_QUERIES_PER_REQUEST = "40"
RESEARCH_RUNTIME_QUALIFICATION = '{"versione":1,"id":"g5c03-misura","deployment":"research-staging-g5c03","max_contributions_per_request":5,"max_d1_queries_per_request":40,"valida_fino":"2026-09-16T00:00:00Z"}'
